document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 12px 'Montserrat'\">DS v1.0 (protótipo V1)<\u002Fa><\u002Fdiv>\n<\u002Fnav>\n<main style=\"flex:1;min-width:0;max-width:1180px\">\n<div style=\"display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:999px;background:#0d6e7a;margin-bottom:16px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#fff\"><\u002Fspan><span style=\"font:600 12px/1 'Montserrat';letter-spacing:.06em;color:#fff\">BIBLIOTECA DE PRODUTO · V5<\u002Fspan><\u002Fdiv>\n<h1 style=\"font:700 36px/1.15 'Montserrat';color:#1a2733;margin:0 0 10px;letter-spacing:-.02em\">EvoluCard Design System<\u002Fh1>\n<p style=\"font:400 16px/1.6 'Montserrat';color:#5c6b76;margin:0 0 24px;max-width:70ch;text-wrap:pretty\">Inventário dos fundamentos, componentes e telas da V5 do EvoluCard: limite automático formado por uma janela móvel de 15 dias de recebíveis, reserva de segurança de 5%, destinação transparente de cada recebível e devolução via Pix. Os valores documentados são os aplicados na V5, não uma proposta nova.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:56px\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:16px\"><div style=\"font:700 28px/1.1 'Montserrat';color:#0d6e7a\">50<\u002Fdiv><div style=\"font:400 13px/1.4 'Montserrat';color:#5c6b76;margin-top:4px\">telas navegáveis na V5<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:16px\"><div style=\"font:700 28px/1.1 'Montserrat';color:#0d6e7a\">36<\u002Fdiv><div style=\"font:400 13px/1.4 'Montserrat';color:#5c6b76;margin-top:4px\">componentes documentados<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:16px\"><div style=\"font:700 28px/1.1 'Montserrat';color:#0d6e7a\">17<\u002Fdiv><div style=\"font:400 13px/1.4 'Montserrat';color:#5c6b76;margin-top:4px\">estados de recebível e repasse<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:16px\"><div style=\"font:700 28px/1.1 'Montserrat';color:#0d6e7a\">3<\u002Fdiv><div style=\"font:400 13px/1.4 'Montserrat';color:#5c6b76;margin-top:4px\">breakpoints: mobile, tablet e desktop<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<section id=\"uso\" style=\"margin-bottom:64px;scroll-margin-top:32px\">\n<div style=\"font:600 11px/1 'Montserrat';letter-spacing:.1em;color:#0080AB;margin-bottom:8px\">00<\u002Fdiv>\n<h2 style=\"font:700 26px/1.2 'Montserrat';color:#1a2733;margin:0 0 8px\">Como usar no Figma<\u002Fh2>\n<p style=\"font:400 15px/1.6 'Montserrat';color:#5c6b76;margin:0 0 20px;max-width:70ch;text-wrap:pretty\">Suba as camadas nesta ordem para que cada componente já nasça amarrado ao token certo.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:16px\"><div style=\"font:600 11px/1 'Montserrat';letter-spacing:.08em;color:#0080AB;margin-bottom:8px\">CAMADA 1<\u002Fdiv><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733;margin-bottom:4px\">Variables<\u002Fdiv><div style=\"font:400 13px/1.5 'Montserrat';color:#5c6b76\">Coleção <strong style=\"color:#1a2733\">EvoluCard/Primitives<\u002Fstrong> com os hex da V5 e <strong style=\"color:#1a2733\">EvoluCard/Semantic<\u002Fstrong> apontando para eles. Uma coleção extra, <strong style=\"color:#1a2733\">EvoluCard/DataViz<\u002Fstrong>, guarda as cinco cores de destinação.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:16px\"><div style=\"font:600 11px/1 'Montserrat';letter-spacing:.08em;color:#0080AB;margin-bottom:8px\">CAMADA 2<\u002Fdiv><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733;margin-bottom:4px\">Text styles<\u002Fdiv><div style=\"font:400 13px/1.5 'Montserrat';color:#5c6b76\">Quinze estilos em Montserrat variável, nomeados por função. Line height sempre em porcentagem.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:16px\"><div style=\"font:600 11px/1 'Montserrat';letter-spacing:.08em;color:#0080AB;margin-bottom:8px\">CAMADA 3<\u002Fdiv><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733;margin-bottom:4px\">Effects e grids<\u002Fdiv><div style=\"font:400 13px/1.5 'Montserrat';color:#5c6b76\">Seis sombras tingidas de teal e três layout grids: mobile fluido, tablet 720 e desktop 1040.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:16px\"><div style=\"font:600 11px/1 'Montserrat';letter-spacing:.08em;color:#0080AB;margin-bottom:8px\">CAMADA 4<\u002Fdiv><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733;margin-bottom:4px\">Components<\u002Fdiv><div style=\"font:400 13px/1.5 'Montserrat';color:#5c6b76\">Component sets com as propriedades listadas em cada bloco. Todo componente com texto usa auto layout em hug ou fill.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#0d6e7a;border-radius:14px;padding:20px 22px;display:flex;gap:16px;align-items:flex-start\">\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" stroke-linecap=\"round\" style=\"flex:none;margin-top:1px\"><circle cx=\"10\" cy=\"10\" r=\"7\"><\u002Fcircle><path d=\"M10 9v4.5M10 6.5h.01\"><\u002Fpath><\u002Fsvg>\n<div style=\"font:400 14px/1.65 'Montserrat';color:#cfd8dc;max-width:88ch;text-wrap:pretty\">Esta versão substitui a v1.0, que documentava o protótipo V1 em Inter e navy. A V5 usa Montserrat, teal institucional e azul de ação. A v1.0 continua disponível como arquivo separado, sem alterações.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"modelo\" style=\"margin-bottom:64px;scroll-margin-top:32px\">\n<div style=\"font:600 11px/1 'Montserrat';letter-spacing:.1em;color:#0080AB;margin-bottom:8px\">01<\u002Fdiv>\n<h2 style=\"font:700 26px/1.2 'Montserrat';color:#1a2733;margin:0 0 8px\">Modelo do produto<\u002Fh2>\n<p style=\"font:400 15px/1.6 'Montserrat';color:#5c6b76;margin:0 0 20px;max-width:70ch;text-wrap:pretty\">Os componentes de valor existem para explicar esta conta. Toda tela que mostra dinheiro parte das mesmas quatro grandezas e usa os mesmos nomes.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\">\n<div style=\"font:600 12px/1.2 'Montserrat';letter-spacing:.04em;color:#5c6b76;margin-bottom:12px\">A CONTA DO LIMITE<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"font:400 15px/1.3 'Montserrat';color:#5c6b76\">Recebíveis vinculados<\u002Fspan><span style=\"font:600 15px/1.3 'Montserrat';color:#1a2733\">R$ 20.000,00<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"font:400 15px/1.3 'Montserrat';color:#5c6b76\">− Reserva de segurança (5%)<\u002Fspan><span style=\"font:600 15px/1.3 'Montserrat';color:#1a2733\">R$ 1.000,00<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:12px;border-top:1px solid #d8dee2;padding-top:10px\"><span style=\"font:600 15px/1.3 'Montserrat';color:#0d6e7a\">= Limite para compras<\u002Fspan><span style=\"font:700 15px/1.3 'Montserrat';color:#0d6e7a\">R$ 19.000,00<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"font:400 15px/1.3 'Montserrat';color:#5c6b76\">− Compras sustentadas por recebíveis futuros<\u002Fspan><span style=\"font:600 15px/1.3 'Montserrat';color:#1a2733\">R$ 4.000,00<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:12px;border-top:1px solid #d8dee2;padding-top:10px\"><span style=\"font:600 15px/1.3 'Montserrat';color:#216f43\">= Disponível agora<\u002Fspan><span style=\"font:700 17px/1.2 'Montserrat';color:#216f43\">R$ 15.000,00<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:16px\"><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733;margin-bottom:4px\">Janela móvel de 15 dias<\u002Fdiv><div style=\"font:400 13px/1.5 'Montserrat';color:#5c6b76\">Todo dia o produto busca recebíveis com liquidação de D a D+14. Os já vinculados seguem acompanhados até a liquidação e a destinação, mesmo fora da janela.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:16px\"><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733;margin-bottom:4px\">Vinculação automática<\u002Fdiv><div style=\"font:400 13px/1.5 'Montserrat';color:#5c6b76\">Não existe seleção manual de recebíveis nem ajuste de limite pelo cliente. As telas antigas de ajuste e simulação ficam fora da navegação.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:16px\"><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733;margin-bottom:4px\">Destinação transparente<\u002Fdiv><div style=\"font:400 13px/1.5 'Montserrat';color:#5c6b76\">Na liquidação, cada recebível se divide em compras, reserva, limite e devolução. O excedente volta ao cliente por Pix.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"cor\" style=\"margin-bottom:64px;scroll-margin-top:32px\">\n<div style=\"font:600 11px/1 'Montserrat';letter-spacing:.1em;color:#0080AB;margin-bottom:8px\">02<\u002Fdiv>\n<h2 style=\"font:700 26px/1.2 'Montserrat';color:#1a2733;margin:0 0 8px\">Cor<\u002Fh2>\n<p style=\"font:400 15px/1.6 'Montserrat';color:#5c6b76;margin:0 0 20px;max-width:70ch;text-wrap:pretty\">O teal institucional carrega marca, estrutura e valores de destaque. O azul é reservado para a ação de compra e para links de ajuda. O verde marca o limite para compras e tudo que é disponível ou concluído.<\u002Fp>\n<div style=\"font:600 11px/1 'Montserrat';letter-spacing:.08em;color:#5c6b76;margin:0 0 10px\">PRIMITIVAS · MARCA E AÇÃO<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px\">\n<sc-for list=\"{{ corMarca }}\" as=\"c\" hint-placeholder-count=\"5\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;overflow:hidden\"><div style=\"height:72px;background:{{ c.h }}\"><\u002Fdiv><div style=\"padding:12px 14px\"><div style=\"font:600 13px/1.3 'Montserrat';color:#1a2733\">{{ c.n }}<\u002Fdiv><div style=\"font:500 12px/1.5 ui-monospace,Menlo,monospace;color:#006688\">{{ c.h }}<\u002Fdiv><div style=\"font:400 12px/1.45 'Montserrat';color:#5c6b76;margin-top:6px\">{{ c.u }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font:600 11px/1 'Montserrat';letter-spacing:.08em;color:#5c6b76;margin:0 0 10px\">PRIMITIVAS · NEUTRAS<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px\">\n<sc-for list=\"{{ corNeutra }}\" as=\"c\" hint-placeholder-count=\"10\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;overflow:hidden\"><div style=\"height:56px;background:{{ c.h }};border-bottom:1px solid #eef2f4\"><\u002Fdiv><div style=\"padding:10px 12px\"><div style=\"font:600 12px/1.3 'Montserrat';color:#1a2733\">{{ c.n }}<\u002Fdiv><div style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#006688\">{{ c.h }}<\u002Fdiv><div style=\"font:400 11px/1.45 'Montserrat';color:#5c6b76;margin-top:4px\">{{ c.u }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font:600 11px/1 'Montserrat';letter-spacing:.08em;color:#5c6b76;margin:0 0 10px\">PRIMITIVAS · SOBRE TEAL<\u002Fdiv>\n<div style=\"display:g rap:pretty\">Cards comuns são planos, separados por borda. A sombra tingida de teal marca o card principal de cada tela e o que flutua sobre o conteúdo.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px\">\n<sc-for list=\"{{ shadowRows }}\" as=\"e\" hint-placeholder-count=\"7\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:20px\"><div style=\"height:56px;border-radius:12px;background:#fff;border:1px solid #dde3e6;margin-bottom:14px;box-shadow:{{ e.css }}\"><\u002Fdiv><div style=\"font:500 12px/1.4 ui-monospace,Menlo,monospace;color:#1a2733\">{{ e.n }}<\u002Fdiv><div style=\"font:500 11px/1.5 ui-monospace,Menlo,monospace;color:#006688;margin-top:2px\">{{ e.css }}<\u002Fdiv><div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76;margin-top:4px\">{{ e.u }}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:20px\">\n<div style=\"font:600 11px/1 'Montserrat';letter-spacing:.08em;color:#5c6b76;margin-bottom:14px\">MOVIMENTO · SMART ANIMATE<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px\">\n<div><div style=\"font:600 13px/1.35 'Montserrat';color:#1a2733;margin-bottom:3px\">Toast<\u002Fdiv><div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76\">280 ms · ease · sobe 14 com fade.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 13px/1.35 'Montserrat';color:#1a2733;margin-bottom:3px\">Bottom sheet<\u002Fdiv><div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76\">300 ms · cubic-bezier(.2,.8,.2,1) · 100% do corpo.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 13px/1.35 'Montserrat';color:#1a2733;margin-bottom:3px\">Backdrop<\u002Fdiv><div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76\">200 ms · fade · teal a 55%.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 13px/1.35 'Montserrat';color:#1a2733;margin-bottom:3px\">Pulso<\u002Fdiv><div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76\">1100 ms em loop · 35% a 100% · defasagem de 180 ms.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 13px/1.35 'Montserrat';color:#1a2733;margin-bottom:3px\">Spinner<\u002Fdiv><div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76\">800 ms linear · 34 px · traço 3, topo em teal.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"responsivo\" style=\"margin-bottom:64px;scroll-margin-top:32px\">\n<div style=\"font:600 11px/1 'Montserrat';letter-spacing:.1em;color:#0080AB;margin-bottom:8px\">06<\u002Fdiv>\n<h2 style=\"font:700 26px/1.2 'Montserrat';color:#1a2733;margin:0 0 8px\">Responsivo<\u002Fh2>\n<p style=\"font:400 15px/1.6 'Montserrat';color:#5c6b76;margin:0 0 20px;max-width:70ch;text-wrap:pretty\">A V5 é um único app em três larguras. A navegação muda de lugar no desktop; o conteúdo continua em coluna, com a Home dividida em duas.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\">\n<div style=\"height:150px;border-radius:10px;background:#eef2f4;display:flex;justify-content:center;padding-top:12px;margin-bottom:14px\"><div style=\"width:84px;height:138px;border-radius:12px 12px 0 0;background:#fff;border:1px solid #d8dee2;overflow:hidden;display:flex;flex-direction:column\"><div style=\"height:26px;background:#0d6e7a\"><\u002Fdiv><div style=\"flex:1;padding:6px;display:flex;flex-direction:column;gap:4px\"><div style=\"height:36px;border-radius:5px;background:#e8f5ee;margin-top:-14px;border:1px solid #dde3e6\"><\u002Fdiv><div style=\"height:14px;border-radius:4px;background:#eef2f4\"><\u002Fdiv><div style=\"height:14px;border-radius:4px;background:#eef2f4\"><\u002Fdiv><\u002Fdiv><div style=\"height:16px;border-top:1px solid #d8dee2\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733\">Mobile · até 767<\u002Fdiv>\n<div style=\"font:400 13px/1.55 'Montserrat';color:#5c6b76;margin-top:4px\">Coluna fluida, margem 16. Cabeçalho teal por tela, barra inferior fixa com 4 abas. Na Home, o card de limite sobe 52 sobre o cabeçalho.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\">\n<div style=\"height:150px;border-radius:10px;background:#eef2f4;display:flex;justify-content:center;padding-top:12px;margin-bottom:14px\"><div style=\"width:150px;height:138px;border-radius:12px 12px 0 0;background:#fff;border:1px solid #d8dee2;overflow:hidden;display:flex;flex-direction:column\"><div style=\"height:26px;background:#0d6e7a\"><\u002Fdiv><div style=\"flex:1;padding:6px 22px;display:flex;flex-direction:column;gap:4px\"><div style=\"height:36px;border-radius:5px;background:#e8f5ee;margin-top:-14px;border:1px solid #dde3e6\"><\u002Fdiv><div style=\"height:14px;border-radius:4px;background:#eef2f4\"><\u002Fdiv><div style=\"height:14px;border-radius:4px;background:#eef2f4\"><\u002Fdiv><\u002Fdiv><div style=\"height:16px;border-top:1px solid #d8dee2\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733\">Tablet · 768 a 1023<\u002Fdiv>\n<div style=\"font:400 13px/1.55 'Montserrat';color:#5c6b76;margin-top:4px\">Mesma estrutura do mobile, com a coluna limitada a 720 e centralizada. Telas de acesso centralizam o card verticalmente.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\">\n<div style=\"height:150px;border-radius:10px;background:#eef2f4;display:flex;justify-content:center;padding-top:12px;margin-bottom:14px\"><div style=\"width:230px;height:138px;border-radius:8px 8px 0 0;background:#eef2f4;border:1px solid #d8dee2;overflow:hidden;display:flex;flex-direction:column\"><div style=\"height:18px;background:#0d6e7a;display:flex;align-items:center;gap:4px;padding:0 8px\"><span style=\"width:18px;height:5px;border-radius:2px;background:#fff\"><\u002Fspan><span style=\"width:14px;height:5px;border-radius:2px;background:rgba(255,255,255,.4);margin-left:8px\"><\u002Fspan><span style=\"width:14px;height:5px;border-radius:2px;background:rgba(255,255,255,.4)\"><\u002Fspan><span style=\"width:14px;height:5px;border-radius:2px;background:rgba(255,255,255,.4)\"><\u002Fspan><\u002Fdiv><div style=\"flex:1;padding:8px 18px;display:grid;grid-template-columns:1.1fr .9fr;gap:6px\"><div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"height:52px;border-radius:5px;background:#fff;border:1px solid #dde3e6\"><\u002Fdiv><div style=\"height:26px;border-radius:5px;background:#fff\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"height:34px;border-radius:5px;background:#fff\"><\u002Fdiv><div style=\"height:44px;border-radius:5px;background:#fff\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733\">Desktop · 1024 ou mais<\u002Fdiv>\n<div style=\"font:400 13px/1.55 'Montserrat';color:#5c6b76;margin-top:4px\">Barra de topo teal de 64 com as 4 seções e a empresa à direita. Coluna de 1040. Home em duas colunas 1,1fr e 0,9fr, gap 16. Cabeçalho de tela vira título escuro 22 com voltar teal.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"icones\" style=\"margin-bottom:64px;scroll-margin-top:32px\">\n<div style=\"font:600 11px/1 'Montserrat';letter-spacing:.1em;color:#0080AB;margin-bottom:8px\">07<\u002Fdiv>\n<h2 style=\"font:700 26px/1.2 'Montserrat';color:#1a2733;margin:0 0 8px\">Iconografia<\u002Fh2>\n<p style=\"font:400 15px/1.6 'Montserrat';color:#5c6b76;margin:0 0 20px;max-width:70ch;text-wrap:pretty\">Traço 1,5, pontas arredondadas, sem preenchimento. 22 na navegação, 20 em atalhos e alertas, 18 em ícone em caixa, 14 ao lado de legendas. A cor vem do contexto: teal no app, ink/600 em apoio, branco sobre teal.<\u002Fp>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:22px\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px\">\n<sc-for list=\"{{ icons }}\" as=\"i\" hint-placeholder-count=\"20\">\n<div style=\"border:1px solid #eef2f4;border-radius:10px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:9px\" style-hover=\"border-color:#d8dee2;background:#f7f9fa\">\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 22 22\" fill=\"none\" stroke=\"#0d6e7a\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ i.svg }}\"><\u002Fsvg>\n<span style=\"font:500 11px/1.3 ui-monospace,Menlo,monospace;color:#5c6b76;text-align:center\">{{ i.name }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\"><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733;margin-bottom:10px\">Ícone em caixa<\u002Fdiv><div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:36px;height:36px;border-radius:10px;background:#eef2f4;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"#0d6e7a\" stroke-width=\"1.5\" stroke-linecap=\"round\"><rect x=\"3\" y=\"5.5\" width=\"14\" height=\"9\" rx=\"2\"><\u002Frect><path d=\"M3 9h14\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"width:36px;height:36px;border-radius:10px;background:#FBEDEB;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"#d64545\" stroke-width=\"1.5\" stroke-linecap=\"round\"><circle cx=\"10\" cy=\"10\" r=\"6.5\"><\u002Fcircle><path d=\"M10 6.5v4M10 13.4h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"width:44px;height:44px;border-radius:14px;background:#FBEDEB;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"#d64545\" stroke-width=\"1.5\" stroke-linecap=\"round\"><circle cx=\"10\" cy=\"10\" r=\"7\"><\u002Fcircle><path d=\"M10 6.5v4.2M10 13.4h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan><div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76\">36 raio 10 em listas · 44 a 52 raio 14 em estados vazios e de erro<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\"><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733;margin-bottom:10px\">Marca de resultado<\u002Fdiv><div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:56px;height:56px;border-radius:50%;background:#2e9e5b;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"width:28px;height:28px;border-radius:50%;background:#2e9e5b;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan><div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76\">Círculo success 64 ou 56 em tela de resultado, 36 ou 28 dentro de card de confirmação<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"height:1px;background:#d8dee2;margin:0 0 56px\"><\u002Fdiv>\n\n<section id=\"botoes\" style=\"margin-bottom:64px;scroll-margin-top:32px\">\n<div style=\"font:600 11px/1 'Montserrat';letter-spacing:.1em;color:#0080AB;margin-bottom:8px\">08<\u002Fdiv>\n<h2 style=\"font:700 26px/1.2 'Montserrat';color:#1a2733;margin:0 0 8px\">Botões<\u002Fh2>\n<p style=\"font:400 15px/1.6 'Montserrat';color:#5c6b76;margin:0 0 8px;max-width:70ch;text-wrap:pretty\">Raio 10, rótulo 600. Largura total quando é a ação da tela; largura do conteúdo quando é uma ação dentro de card ou alerta.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px\"><span style=\"font:500 11px/1 ui-monospace,Menlo,monospace;color:#006688;background:#e6f1f6;border:1px solid #a9d6e8;border-radius:6px;padding:6px 9px\">Button<\u002Fspan><span style=\"font:400 11px/1 'Montserrat';color:#5c6b76;background:#fff;border:1px solid #d8dee2;border-radius:6px;padding:6px 9px\">variant: primary · purchase · secondary · tertiary · ghost · on-teal<\u002Fspan><span style=\"font:400 11px/1 'Montserrat';color:#5c6b76;background:#fff;border:1px solid #d8dee2;border-radius:6px;padding:6px 9px\">size: lg 48 · auth 46 · md 44 · sm 40 · xs 38<\u002Fspan><span style=\"font:400 11px/1 'Montserrat';color:#5c6b76;background:#fff;border:1px solid #d8dee2;border-radius:6px;padding:6px 9px\">state: default · hover · disabled<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:20px\"><div style=\"font:600 13px/1.3 'Montserrat';color:#1a2733;margin-bottom:3px\">purchase<\u002Fdiv><div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76;margin-bottom:14px\">Ação de compra da Home. Azul blue/500, hover blue/600. Um por tela.<\u002Fdiv><button style=\"width:100%;height:48px;border-radius:10px;border:0;background:#0080AB;color:#fff;font:600 15px 'Montserrat';cursor:pointer\" style-hover=\"background:#006688\">Comprar com cartão virtual<\u002Fbutton><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:20px\"><div style=\"font:600 13px/1.3 'Montserrat';color:#1a2733;margin-bottom:3px\">primary<\u002Fdiv><div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76;margin-bottom:14px\">Ação principal de fluxo. Teal/700, hover teal/800. Desabilitado em line/200 com rótulo branco.<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:8px\"><button style=\"width:100%;height:48px;border-radius:10px;border:0;background:#0d6e7a;color:#fff;font:600 15px 'Montserrat';cursor:pointer\" style-hover=\"background:#095a64\">Confirmar chave<\u002Fbutton><button disabled=\"{{ true }}\" style=\"width:100%;height:48px;border-radius:10px;border:0;background:#d8dee2;color:#fff;font:600 15px 'Montserrat'\">Continuar<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:20px\"><div style=\"font:600 13px/1.3 'Montserrat';color:#1a2733;margin-bottom:3px\">secondary<\u002Fdiv><div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76;margin-bottom:14px\">Caminho para aprofundar. Borda 1,5 teal, fundo branco, hover bg/100.<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:8px\"><button style=\"width:100%;height:48px;border-radius:10px;border:1.5px solid #0d6e7a;background:#fff;color:#0d6e7a;font:600 15px 'Montserrat';cursor:pointer\" style-hover=\"background:#eef2f4\">Ver recebíveis<\u002Fbutton><button style=\"width:100%;height:44px;border-radius:10px;border:1.5px solid #0d6e7a;background:#fff;color:#0d6e7a;font:600 13px 'Montserrat';cursor:pointer\" style-hover=\"background:#eef2f4\">Ver composição do limite<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:20px\"><div style=\"font:600 13px/1.3 'Montserrat';color:#1a2733;margin-bottom:3px\">tertiary<\u002Fdiv><div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76;margin-bottom:14px\">Ação de apoio dentro de card. Borda 1 line/200, rótulo teal, hover troca a borda para teal.<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:8px;align-items:flex-start\"><button style=\"width:100%;height:44px;border-radius:10px;border:1px solid #d8dee2;background:#fff;color:#0d6e7a;font:600 13px 'Montserrat';cursor:pointer\" style-hover=\"border-color:#0d6e7a\">Dados para repasse<\u002Fbutton><button style=\"height:40px;padding:0 14px;border-radius:10px;border:1px solid #d8dee2;background:#fff;color:#0d6e7a;font:600 13px 'Montserrat';cursor:pointer\" style-hover=\"border-color:#0d6e7a\">Ver composição<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:20px\"><div style=\"font:600 13px/1.3 'Montserrat';color:#1a2733;margin-bottom:3px\">ghost · link<\u002Fdiv><div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76;margin-bottom:14px\">Saída secundária abaixo do primário, e links de texto em card. Teal no app, azul nas telas de acesso.<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:8px;align-items:flex-start\"><button style=\"width:100%;height:48px;border-radius:10px;border:0;background:transparent;color:#0d6e7a;font:600 15px 'Montserrat';cursor:pointer\" style-hover=\"background:#eef2f4\">Preciso de ajuda<\u002Fbutton><div style=\"display:flex;gap:18px\"><button style=\"border:0;background:transparent;padding:4px;font:600 13px 'Montserrat';color:#0d6e7a;cursor:pointer\">Ver todas<\u002Fbutton><button style=\"border:0;background:transparent;padding:4px;font:600 13px 'Montserrat';color:#0080AB;cursor:pointer\">Tentar de outra forma<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#0d6e7a;border-radius:14px;padding:20px\"><div style=\"font:600 13px/1.3 'Montserrat';color:#fff;margin-bottom:3px\">on-teal · icon<\u002Fdiv><div style=\"font:400 12px/1.5 'Montserrat';color:#cfd8dc;margin-bottom:14px\">Voltar 40 sem moldura; perfil 44 com moldura branca a 18%. Hover preenche a 12%.<\u002Fdiv><div style=\"display:flex;gap:10px\"><button aria-label=\"Voltar\" style=\"width:40px;height:40px;border-radius:10px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:rgba(255,255,255,.12)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 4l-6 6 6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton><button aria-label=\"Perfil\" style=\"width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);cursor:pointer;font:600 15px 'Montserrat';color:#fff\" style-hover=\"background:rgba(255,255,255,.14)\">M<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:20px\"><div style=\"font:600 13px/1.3 'Montserrat';color:#1a2733;margin-bottom:14px\">Filtro<\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:6px\"><button style=\"height:34px;padding:0 14px;border-radius:999px;border:1px solid #0d6e7a;background:#0d6e7a;color:#fff;font:600 13px 'Montserrat';cursor:pointer\">Todos<\u002Fbutton><button style=\"height:34px;padding:0 14px;border-radius:999px;border:1px solid #d8dee2;background:#fff;color:#1a2733;font:600 13px 'Montserrat';cursor:pointer\">Vinculados<\u002Fbutton><button style=\"height:34px;padding:0 14px;border-radius:999px;border:1px solid #d8dee2;background:#fff;color:#1a2733;font:600 13px 'Montserrat';cursor:pointer\">Liquidados<\u002Fbutton><\u002Fdiv><div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76;margin-top:12px\">Pílula 34, gap 6. Selecionado em teal sólido. Usado na agenda de recebíveis.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:20px\"><div style=\"font:600 13px/1.3 'Montserrat';color:#1a2733;margin-bottom:14px\">Par la abel>\n<input sc-camel-default-value=\"usuario@estab.com.br\" style=\"width:100%;height:46px;border-radius:10px;border:1.5px solid #d8dee2;padding:0 14px;font:400 15px 'Montserrat';color:#1a2733;background:#fff;margin-bottom:14px\" style-focus=\"border-color:#0080AB;outline:none\">\n<label style=\"display:block;font:600 13px/1.2 'Montserrat';color:#1a2733;margin-bottom:6px\">Código<\u002Flabel>\n<input sc-camel-default-value=\"482 910\" style=\"width:100%;height:46px;border-radius:10px;border:1.5px solid #0080AB;padding:0 14px;font:400 15px 'Montserrat';color:#1a2733;background:#fff;letter-spacing:.06em\" style-focus=\"outline:none\">\n<div style=\"background:#FBEDEB;border:1px solid #EBC4BF;border-radius:10px;padding:10px 12px;margin-top:12px;font:500 13px/1.4 'Montserrat';color:#a83232\">Código inválido. Tente novamente.<\u002Fdiv>\n<div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76;margin-top:12px\">Altura 46, rótulo em sentence case 13/600 escuro. Foco em blue/500. Erro aparece como caixa danger abaixo, não como borda vermelha.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:20px\">\n<div style=\"font:600 13px/1.3 'Montserrat';color:#1a2733;margin-bottom:14px\">Input · app<\u002Fdiv>\n<label style=\"display:block;font:600 12px/1.2 'Montserrat';letter-spacing:.04em;color:#5c6b76;margin-bottom:6px\">CHAVE PIX · CNPJ<\u002Flabel>\n<input sc-camel-default-value=\"12.345.678/0001-90\" style=\"width:100%;height:48px;border-radius:10px;border:1.5px solid #d8dee2;padding:0 14px;font:400 15px 'Montserrat';color:#1a2733;background:#fff\" style-focus=\"border-color:#0d6e7a;outline:none\">\n<div style=\"font:400 12px/1.45 'Montserrat';color:#5c6b76;margin-top:8px\">Nesta POC não fazemos validação bancária. Os dados são representativos.<\u002Fdiv>\n<div style=\"height:1px;background:#eef2f4;margin:16px 0\"><\u002Fdiv>\n<div style=\"font:600 13px/1.3 'Montserrat';color:#1a2733;margin-bottom:10px\">Checkbox<\u002Fdiv>\n<div style=\"display:flex;gap:18px\"><span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:18px;height:18px;border-radius:5px;border:1.5px solid #0080AB;background:#0080AB;display:flex;align-items:center;justify-content:center\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2.5 6.2l2.4 2.4 4.6-5\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font:400 13px 'Montserrat';color:#5c6b76\">Lembrar meu usuário<\u002Fspan><\u002Fspan><span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:18px;height:18px;border-radius:5px;border:1.5px solid #d8dee2;background:#fff\"><\u002Fspan><span style=\"font:400 13px 'Montserrat';color:#5c6b76\">Desmarcado<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76;margin-top:12px\">Altura 48, rótulo em label/caps. Foco em teal. Apoio em caption abaixo, gap 8.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:20px\">\n<div style=\"font:600 13px/1.3 'Montserrat';color:#1a2733;margin-bottom:14px\">RadioCard · tipo de chave Pix<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<div style=\"background:#fff;border:1.5px solid #0d6e7a;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center\"><span style=\"width:22px;height:22px;border-radius:50%;border:1.5px solid #0d6e7a;flex:none;display:flex;align-items:center;justify-content:center\"><span style=\"width:12px;height:12px;border-radius:50%;background:#0d6e7a\"><\u002Fspan><\u002Fspan><span style=\"font:600 15px/1.3 'Montserrat';color:#1a2733\">CNPJ<\u002Fspan><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center\"><span style=\"width:22px;height:22px;border-radius:50%;border:1.5px solid #d ontserrat';letter-spacing:.1em;color:#0080AB;margin-bottom:8px\">10<\u002Fdiv>\n<h2 style=\"font:700 26px/1.2 'Montserrat';color:#1a2733;margin:0 0 8px\">Badges de estado<\u002Fh2>\n<p style=\"font:400 15px/1.6 'Montserrat';color:#5c6b76;margin:0 0 8px;max-width:70ch;text-wrap:pretty\">Cada recebível e cada repasse tem um estado explícito. O tom segue a regra: neutro para o que só existe, info para o que compõe o limite, warning para o que aguarda, success para o que concluiu, danger para o que falhou ou ficou de fora.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px\"><span style=\"font:500 11px/1 ui-monospace,Menlo,monospace;color:#006688;background:#e6f1f6;border:1px solid #a9d6e8;border-radius:6px;padding:6px 9px\">Badge/Status<\u002Fspan><span style=\"font:400 11px/1 'Montserrat';color:#5c6b76;background:#fff;border:1px solid #d8dee2;border-radius:6px;padding:6px 9px\">tone: neutral · info · warning · success · danger<\u002Fspan><span style=\"font:400 11px/1 'Montserrat';color:#5c6b76;background:#fff;border:1px solid #d8dee2;border-radius:6px;padding:6px 9px\">size: md 26 · sm 24 · xs 22<\u002Fspan><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;overflow:hidden;margin-bottom:16px\">\n<div style=\"display:grid;grid-template-columns:100px minmax(230px,1.1fr) minmax(0,2fr);gap:16px;padding:11px 18px;background:#f7f9fa;border-bottom:1px solid #d8dee2\"><div style=\"font:600 11px/1 'Montserrat';letter-spacing:.06em;color:#5c6b76\">ETAPA<\u002Fdiv><div style=\"font:600 11px/1 'Montserrat';letter-spacing:.06em;color:#5c6b76\">BADGE<\u002Fdiv><div style=\"font:600 11px/1 'Montserrat';letter-spacing:.06em;color:#5c6b76\">SIGNIFICADO<\u002Fdiv><\u002Fdiv>\n<sc-for list=\"{{ estados }}\" as=\"e\" hint-placeholder-count=\"17\">\n<div style=\"display:grid;grid-template-columns:100px minmax(230px,1.1fr) minmax(0,2fr);gap:16px;padding:12px 18px;border-bottom:1px solid #eef2f4;align-items:center\">\n<div style= yle=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\"><span style=\"font:400 15px/1.3 'Montserrat';color:#5c6b76\">− Compras sustentadas por recebíveis futuros<\u002Fspan><span style=\"font:600 15px/1.3 'Montserrat';color:#1a2733\">R$ 4.000,00<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:1px solid #d8dee2;padding-top:12px\"><span style=\"font:600 15px/1.3 'Montserrat';color:#216f43\">= Disponível agora<\u002Fspan><span style=\"font:700 17px/1.2 'Montserrat';color:#216f43\">R$ 15.000,00<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76;margin-top:10px\">O ícone de ajuda azul ao lado de \"Reserva\" leva à tela de reserva. O mesmo padrão aparece no card de vinculados em Recebíveis.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#eef2f4;border:1px solid #d8dee2;border-radius:14px;padding:20px\">\n<div style=\"font:600 13px/1.3 'Montserrat';color:#1a2733;margin-bottom:4px\">Card/ChangeLog<\u002Fdiv>\n<div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76;margin-bottom:14px\">O que mudou no dia. Sinal em círculo bg/100, texto, valor e alvo à direita. Cor do sinal e do valor segue o efeito no limite.<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:16px\">\n<div style=\"font:600 12px/1.2 'Montserrat';letter-spacing:.04em;color:#5c6b76\">O QUE MUDOU EM 05/09<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;margin-top:6px\">\n<div style=\"display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eef2f4\"><span style=\"width:24px;height:24px;border-radius:50%;background:#eef2f4;flex:none;display:flex;align-items:center;justify-content:center;font:700 14px 'Montserrat';color:#a83232\">−<\u002Fspan><span style=\"flex:1;min-width:0;font:400 13px/1.45 'Montserrat';color:#1a2733\">Recebível de 05/09 liquidou e deixou de ser recebível futuro.<\u002Fspan><span style=\"flex:none;text-align:right\"><span style=\"display:block;font:600 13px/1.3 'Montserrat';color:#a83232\">− R$ 3.000,00<\u002Fspan><span style=\"display:block;font:400 11px/1.3 'Montserrat';color:#8a97a1;margin-top:2px\">vinculados<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:12px 0\"><span style=\"width:24px;height:24px;border-radius:50%;background:#eef2f4;flex:none;display:flex;align-items:center;justify-content:center;font:700 14px 'Montserrat';color:#216f43\">+<\u002Fspan><span style=\"flex:1;min-width:0;font:400 13px/1.45 'Montserrat';color:#1a2733\">Novo recebível vinculado dentro da janela.<\u002Fspan><span style=\"flex:none;text-align:right\"><span style=\"display:block;font:600 13px/1.3 'Montserrat';color:#216f43\">+ R$ 800,00<\u002Fspan><span style=\"display:block;font:400 11px/1.3 'Montserrat';color:#8a97a1;margin-top:2px\">vinculados<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#eef2f4;border:1px solid #d8dee2;border-radius:14px;padding:20px\">\n<div style=\"font:600 13px/1.3 'Montserrat';color:#1a2733;margin-bottom:4px\">Card/Window15<\u002Fdiv>\n<div style=\"font:400 12px/1.5 'Montserrat';color:#5c6b76;margin-bottom:14px\">Janela de identificação. Grade de 15 colunas, gap 3, células de 34 com raio 6.<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:16px\">\n<div style=\"font:600 12px/1.2 'Montserrat';letter-spacing:.04em;color:#5c6b76\">JANELA DE IDENTIFICAÇÃO<\u002Fdiv>\n<div style=\"font:700 17px/1.3 'Montserrat';color:#1a2733;margin-top:8px\">01/09 a 15/09<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px;margin-top:14px\">\n<sc-for list=\"{{ janela }}\" as=\"j\" hint-placeholder-count=\"15\">\n<div style=\"height:34px;border-radius:6px;background:{{ j.bg }};border:1px solid {{ j.borda }};display:flex;align-items:center;justify-content:center;font:600 10px/1 'Montserra t';color:#5c6b76\">Controle de apresentação, não do produto. Pílula 48 com borda tracejada teal, avança a linha do tempo de 01/09 a 10/09. Não levar para o Figma de produção.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"estados\" style=\"margin-bottom:64px;scroll-margin-top:32px\">\n<div style=\"font:600 11px/1 'Montserrat';letter-spacing:.1em;color:#0080AB;margin-bottom:8px\">18<\u002Fdiv>\n<h2 style=\"font:700 26px/1.2 'Montserrat';color:#1a2733;margin:0 0 8px\">Estados de conteúdo<\u002Fh2>\n<p style=\"font:400 15px/1.6 'Montserrat';color:#5c6b76;margin:0 0 18px;max-width:70ch;text-wrap:pretty\">A tela de Recebíveis define os estados que toda área de dados precisa ter. Falha de carga nunca bloqueia o cartão, e o texto diz isso.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\"><div style=\"font:500 12px/1.5 ui-monospace,Menlo,monospace;color:#1a2733;margin-bottom:12px\">state: loading<\u002Fdiv><div style=\"border:1px solid #d8dee2;border-radius:14px;padding:16px\"><div style=\"height:14px;border-radius:4px;background:#dde3e6;width:60%\"><\u002Fdiv><div style=\"height:30px;border-radius:6px;background:#dde3e6;width:45%;margin-top:12px\"><\u002Fdiv><div style=\"height:1px;background:#eef2f4;margin:16px 0\"><\u002Fdiv><div style=\"height:12px;border-radius:4px;background:#dde3e6;width:85%\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px;margin-top:12px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#0080AB;animation:evpulse 1.1s ease-in-out infinite\"><\u002Fspan><span style=\"font:400 13px/1.5 'Montserrat';color:#5c6b76\">Atualizando as informações do seu limite.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\"><div style=\"font:500 12px/1.5 ui-monospace,Menlo,monospace;color:#1a2733;margin-bottom:12px\">state: error<\u002Fdiv><div style=\"border:1px solid #d8dee2;border-radius:14px;padding:18px 14px;text-align:center\"><div style=\"width:44px;height:44px;border-radius:14px;background:#FBEDEB;display:flex;align-items:center;justify-content:center;margin:0 auto 12px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"#d64545\" stroke-width=\"1.5\" stroke-linecap=\"round\"><circle cx=\"10\" cy=\"10\" r=\"7\"><\u002Fcircle><path d=\"M10 6.5v4.2M10 13.4h.01\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733\">Não conseguimos carregar seus recebíveis<\u002Fdiv><div style=\"font:400 13px/1.5 'Montserrat';color:#5c6b76;margin-top:6px\">Isso não afeta o uso do seu cartão.<\u002Fdiv><button style=\"width:100%;height:44px;border-radius:10px;border:0;background:#0d6e7a;color:#fff;font:600 13px 'Montserrat';margin-top:14px\">Tentar novamente<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\"><div style=\"font:500 12px/1.5 ui-monospace,Menlo,monospace;color:#1a2733;margin-bottom:12px\">state: unavailable<\u002Fdiv><div style=\"border:1px solid #d8dee2;border-radius:14px;padding:18px 14px\"><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733\">Recebíveis indisponíveis no momento<\u002Fdiv><div style=\"font:400 13px/1.5 'Montserrat';color:#5c6b76;margin-top:6px\">Estamos atualizando as informações do seu limite.<\u002Fdiv><button style=\"width:100%;height:44px;border-radius:10px;border:1.5px solid #0d6e7a;background:#fff;color:#0d6e7a;font:600 13px 'Montserrat';margin-top:14px\">Tentar novamente<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\"><div style=\"font:500 12px/1.5 ui-monospace,Menlo,monospace;color:#1a2733;margin-bottom:12px\">state: empty<\u002Fdiv><div style=\"border:1px solid #d8dee2;border-radius:14px;padding:18px 14px;text-align:center\"><div style=\"width:52px;height:52px;border-radius:14px;background:#eef2f4;display:flex;align-items:center;justify-content:center;margin:0 auto 12px\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5c6b76\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"14\" rx=\"3\"><\u002Frect><path d=\"M3.5 10h17\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733\">Nenhum recebível no EvoluCard<\u002Fdiv><div style=\"font:400 13px/1.5 'Montserrat';color:#5c6b76;margin-top:6px\">Quando recebíveis elegíveis forem considerados no seu limite, eles aparecerão aqui.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\"><div style=\"font:500 12px/1.5 ui-monospace,Menlo,monospace;color:#1a2733;margin-bottom:12px\">state: filter-empty<\u002Fdiv><div style=\"border:1px solid #d8dee2;border-radius:14px;padding:18px 14px;text-align:center\"><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733\">Nenhum recebível neste filtro<\u002Fdiv><div style=\"font:400 13px/1.5 'Montserrat';color:#5c6b76;margin-top:4px\">Escolha outro filtro para ver os demais valores.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\"><div style=\"font:500 12px/1.5 ui-monospace,Menlo,monospace;color:#1a2733;margin-bottom:12px\">state: stale<\u002Fdiv><div style=\"font:400 13px/1.55 'Montserrat';color:#5c6b76\">Quando a agenda do dia falha, a tela mantém a última posição válida e mostra o Alert warning com data e hora da posição exibida, no topo de Home, Composição e Recebíveis.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"linguagem\" style=\"margin-bottom:64px;scroll-margin-top:32px\">\n<div style=\"font:600 11px/1 'Montserrat';letter-spacing:.1em;color:#0080AB;margin-bottom:8px\">19<\u002Fdiv>\n<h2 style=\"font:700 26px/1.2 'Montserrat';color:#1a2733;margin:0 0 8px\">Linguagem<\u002Fh2>\n<p style=\"font:400 15px/1.6 'Montserrat';color:#5c6b76;margin:0 0 18px;max-width:70ch;text-wrap:pretty\">Regras de escrita da V5. Um componente com o texto errado quebra o produto tanto quanto um token errado.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px\">\n<sc-for list=\"{{ regras }}\" as=\"r\" hint-placeholder-count=\"8\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\"><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733;margin-bottom:4px\">{{ r.t }}<\u002Fdiv><div style=\"font:400 13px/1.55 'Montserrat';color:#5c6b76\">{{ r.x }}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;overflow:hidden;margin-top:16px\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:11px 18px;background:#f7f9fa;border-bottom:1px solid #d8dee2\"><div style=\"font:600 11px/1 'Montserrat';letter-spacing:.06em;color:#216f43\">USAR<\u002Fdiv><div style=\"font:600 11px/1 'Montserrat';letter-spacing:.06em;color:#a83232\">EVITAR<\u002Fdiv><\u002Fdiv>\n<sc-for list=\"{{ glossario }}\" as=\"g\" hint-placeholder-count=\"7\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:11px 18px;border-bottom:1px solid #eef2f4\"><div style=\"font:600 13px/1.45 'Montserrat';color:#1a2733\">{{ g.a }}<\u002Fdiv><div style=\"font:400 13px/1.45 'Montserrat';color:#5c6b76\">{{ g.b }}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"telas\" style=\"margin-bottom:64px;scroll-margin-top:32px\">\n<div style=\"font:600 11px/1 'Montserrat';letter-spacing:.1em;color:#0080AB;margin-bottom:8px\">20<\u002Fdiv>\n<h2 style=\"font:700 26px/1.2 'Montserrat';color:#1a2733;margin:0 0 8px\">Inventário de telas da V5<\u002Fh2>\n<p style=\"font:400 15px/1.6 'Montserrat';color:#5c6b76;margin:0 0 18px;max-width:70ch;text-wrap:pretty\">Códigos iguais aos rótulos de tela do arquivo V5, para cruzar comentário, frame do Figma e protótipo.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px\">\n<sc-for list=\"{{ fluxos }}\" as=\"f\" hint-placeholder-count=\"8\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:16px\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\"><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733\">{{ f.t }}<\u002Fdiv><div style=\"font:600 12px/1 'Montserrat';color:#0d6e7a\">{{ f.n }}<\u002Fdiv><\u002Fdiv>\n<div style=\"font:400 12px/1.45 'Montserrat';color:#5c6b76;margin-top:2px\">{{ f.x }}<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;margin-top:10px\">\n<sc-for list=\"{{ f.telas }}\" as=\"s\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;gap:12px;padding:8px 0;border-top:1px solid #eef2f4\"><span style=\"font:600 12px/1.4 ui-monospace,Menlo,monospace;color:#0d6e7a;flex:none;width:44px\">{{ s.c }}<\u002Fspan><span style=\"font:400 13px/1.4 'Montserrat';color:#1a2733;flex:1\">{{ s.t }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"export\" style=\"scroll-margin-top:32px\">\n<div style=\"font:600 11px/1 'Montserrat';letter-spacing:.1em;color:#0080AB;margin-bottom:8px\">21<\u002Fdiv>\n<h2 style=\"font:700 26px/1.2 'Montserrat';color:#1a2733;margin:0 0 8px\">Exportar tokens<\u002Fh2>\n<p style=\"font:400 15px/1.6 'Montserrat';color:#5c6b76;margin:0 0 16px;max-width:70ch;text-wrap:pretty\">Bloco pronto para importar. Formato atual: <strong style=\"color:#1a2733\">{{ formatoNome }}<\u002Fstrong>. Troque em Tweaks para gerar outro.<\u002Fp>\n<div style=\"background:#1a2733;border-radius:14px;padding:22px;overflow:auto;max-height:560px\">\n<pre style=\"margin:0;font:400 12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfd8dc;white-space:pre\">{{ tokensCode }}<\u002Fpre>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:16px\">\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\"><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733;margin-bottom:4px\">Nomenclatura no Figma<\u002Fdiv><div style=\"font:400 13px/1.6 'Montserrat';color:#5c6b76\">Família/variante: Button, Badge/Status, Alert, Card/LimitHero, Card/Composition, Card/Window15, Row/Receivable, Card/Destination, Timeline/History, CardArt, Nav/TopBar, Nav/BottomBar, Overlay/BiometrySheet. Estados vão em propriedades, nunca no nome da camada.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d8dee2;border-radius:14px;padding:18px\"><div style=\"font:600 15px/1.35 'Montserrat';color:#1a2733;margin-bottom:4px\">Antes de publicar<\u002Fdiv><div style=\"font:400 13px/1.6 'Montserrat';color:#5c6b76\">Instalar Montserrat variável, ligar as semânticas às primitivas, manter POC/DaySelector numa página separada e marcada como não publicável, e registrar no Changelog a origem: EvoluCard V5.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;codeFormat&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Figma Variables (JSON)&quot;,&quot;Style Dictionary (JSON)&quot;,&quot;CSS custom properties&quot;],&quot;default&quot;:&quot;Figma Variables (JSON)&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Exportação&quot;}}\">\nconst COR_MARCA = [\n  { n: 'teal/700', h: '#0D6E7A', u: 'Marca, cabeçalhos, botão primário, valores de destaque, aba ativa' },\n  { n: 'teal/800', h: '#095A64', u: 'Hover do primário, fim do gradiente do cartão' },\n  { n: 'teal/600', h: '#0F8592', u: 'Brilho do gradiente do cartão' },\n  { n: 'blue/500', h: '#0080AB', u: 'Comprar com cartão virtual, links de ajuda, foco nos campos de acesso' },\n  { n: 'blue/600', h: '#006688', u: 'Hover da ação de compra, texto do tom info' }\n];\nconst COR_NEUTRA = [\n  { n: 'ink/900', h: '#1A2733', u: 'Títulos, valores, toast' },\n  { n: 'ink/600', h: '#5C6B76', u: 'Corpo de apoio, rótulos, aba inativa' },\n  { n: 'ink/400', h: '#8A97A1', u: 'Legenda, chevron, ponto neutro, reserva' },\n  { n: 'line/300', h: '#B9C4CB', u: 'Traço tracejado de nota de premissa' },\n  { n: 'line/200', h: '#D8DEE2', u: 'Borda de card, campo e divisória forte' },\n  { n: 'line/150', h: '#DDE3E6', u: 'Borda de card elevado, fundo da mesa' },\n  { n: 'surface/muted', h: '#EAEFF1', u: 'Widget de valor preservado' },\n  { n: 'bg/100', h: '#EEF2F4', u: 'Fundo de tela, divisória interna, ícone em caixa' },\n  { n: 'bg/50', h: '#F7F9FA', u: 'Hover de linha de lista' },\n  { n: 'white', h: '#FFFFFF', u: 'Card, campo, barra inferior' }\n];\nconst COR_ONTEAL = [\n  { n: 'on-teal/primary', h: '#FFFFFF', u: 'Título, rótulo e ícone sobre teal' },\n  { n: 'on-teal/body', h: '#CFD8DC', u: 'Parágrafo sobre teal e corpo do toast' },\n  { n: 'on-teal/muted', h: 'rgba(255,255,255,.70)', u: 'Rótulos de validade e código no cartão' },\n  { n: 'on-teal/frame', h: 'rgba(255,255,255,.18)', u: 'Moldura de botão-ícone, aba ativa do topo' }\n];\nconst COR_FEEDBACK = [\n  { n: 'success', base: '#2E9E5B', text: '#216F43', surface: '#E8F5EE', border: '#C6E4D3', spec: 'base #2E9E5B · text #216F43 · surface #E8F5EE · border #C6E4D3 · body #2D5A41', u: 'Limite para compras hoje, Pix concluído, liquidado e conciliado, compra aprovada' },\n  { n: 'warning', base: '#E0A106', text: '#8A6404', surface: '#FDF3DA', border: '#F0D89B', spec: 'base #E0A106 · text #8A6404 · icon #B07F05 · surface #FDF3DA · border #F0D89B', u: 'Em análise, vinculação em andamento, conciliação, agenda desatualizada, reserva retida' },\n  { n: 'danger', base: '#D64545', text: '#A83232', surface: ' : 'color', $value: '{' + v + '}' }; });\n    SPACE.forEach(([k, v]) => { S1[k] = { $type: 'number', $value: v }; });\n    RADIUS.forEach(([k, css]) => { S1[k] = { $type: 'number', $value: parseInt(css, 10) }; });\n    const TS = {}; tx.forEach(([n, s, w, lh, ls]) => { TS[n] = { fontFamily: 'Montserrat', fontSize: s, fontWeight: w, lineHeight: lh + '%', letterSpacing: ls }; });\n    const EF = {}; SHADOWS.forEach(([k, css]) => { EF[k] = css; });\n    return JSON.stringify({ 'EvoluCard/Primitives': { modes: ['Default'], variables: P1 }, 'EvoluCard/Semantic': { modes: ['Default'], variables: S1 }, 'EvoluCard/TextStyles': TS, 'EvoluCard/Effects': EF }, null, 2);\n  }\n  renderVals() {\n    const L = [['#uso','Como usar'],['#modelo','Modelo do produto'],['#cor','Cor'],['#tipografia','Tipografia'],['#espaco','Espaço, raio e alturas'],['#elevacao','Elevação e movimento'],['#responsivo','Responsivo'],['#icones','Iconografia'],['#botoes','Botões'],['#campos','Campos e seletores'],['#badges','Badges de estado'],['#alertas','Alertas e avisos'],['#limite','Cards de limite'],['#recebiveis','Recebíveis e destinação'],['#listas','Linhas e listas'],['#cartao','Cartão virtual'],['#navegacao','Navegação'],['#overlays','Overlays e POC'],['#estados','Estados de conteúdo'],['#linguagem','Linguagem'],['#telas','Inventário de telas'],['#export','Exportar tokens']];\n    return {\n      navLinks: L.map(([href, t]) => ({ href, t })),\n      corMarca: COR_MARCA, corNeutra: COR_NEUTRA, corOnTeal: COR_ONTEAL, corFeedback: COR_FEEDBACK, corViz: COR_VIZ,\n      semanticRows: SEMANTIC.map(([t, hex, p, u]) => ({ t, hex, p, u })),\n      spaceRows: SPACE.map(([name, v, use]) => ({ name, px: v + 'px', use })),\n      radiusRows: RADIUS.map(([n, css, k, u]) => ({ n: n + ' ' + k, css, u })),\n      shadowRows: SHADOWS.map(([n, css, u]) => ({ n, css, u })),\n      icons: ICONS,\n      janela: Array.from({ length: 15 }, (_, i) => {\n        const vinc = [4, 6, 8, 11].indexOf(i) >= 0, proc = i === 13;\n        return { n: String(i + 1).padStart(2, '0'), bg: vinc ? '#0d6e7a' : (proc ? '#e6f1f6' : '#fff'), borda: vinc ? '#0d6e7a' : (proc ? '#a9d6e8' : '#d8dee2'), cor: vinc ? '#fff' : '#5c6b76' };\n      }),\n      baldes: [\n        { cor: '#8A97A1', t: 'Sobre recebíveis futuros', x: 'Reservada enquanto o recebível não liquida.', v: 'R$ 850,00' },\n        { cor: '#E0A106', t: 'Liquidada e retida', x: 'Aguardando a quitação das compras cobertas.', v: 'R$ 150,00' },\n        { cor: '#0080AB', t: 'Liberada para devolução', x: 'Segue para Pix na chave cadastrada.', v: 'R$ 0,00' },\n        { cor: '#2E9E5B', t: 'Devolvida', x: 'Pix concluído.', v: 'R$ 0,00' }\n      ],\n      legenda: [['Compras', '#0D6E7A'], ['Limite', '#0080AB'], ['Reserva', '#8A97A1'], ['Devolução', '#2E9E5B'], ['Em conciliação', '#E0A106']].map(([n, h]) => ({ n, h })),\n      recExemplos: [\n        Object.assign({ dia: '05', valor: 'R$ 3.000,00', segs: [{ w: '95%', cor: '#0D6E7A' }, { w: '5%', cor: '#8A97A1' }], sec1: 'R$ 2.850,00 sustentam compras', sec2: 'R$ 150,00 de reserva' }, TOM.info, { bt: 'Vinculado · liquidação prevista' }),\n        Object.assign({ dia: '07', valor: 'R$ 2.450,00', segs: [{ w: '47%', cor: '#0D6E7A' }, { w: '5%', cor: '#8A97A1' }, { w: '48%', cor: '#E0A106' }], sec1: 'Liquidado R$ 50,00 abaixo do previsto', sec2: 'Excedente identificado após a conciliação' }, TOM.warning, { bt: 'Liquidado, em conciliação' }),\n        Object.assign({ dia: '09', valor: 'R$ 4.000,00', segs: [{ w: '95%', cor: '#2E9E5B' }, { w: '5%', cor: '#8A97A1' }], sec1: 'Liquidação sem utilização', sec2: 'R$ 3.800,00 elegíveis à devolução' }, TOM.success, { bt: 'Liquidado e conciliado' })\n      ],\n      historico: [\n        { d: '01/09 · 09:12', t: 'Recebível identificado e vinculado automaticamente.' },\n        { d: '01/09 · 10:40', t: 'R$ 2.850,00 alocados para a compra em Dental Sul Distribuidora.' },\n        { d: '05/09', t: 'Liquidado e reservado para pagamento do cartão.' },\n        { d: '08/09
